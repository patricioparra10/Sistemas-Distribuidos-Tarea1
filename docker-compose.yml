version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 3600000
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

  metrics:
    build: ./metrics
    ports:
      - "8003:8003"
    depends_on:
      - redis

  response_generator:
    build: ./response_generator
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data
    environment:
      - FAILURE_RATE=0.0
      - EXTRA_LATENCY_MS=0
    depends_on:
      - metrics

  cache_service:
    build: ./cache_service
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      response_generator:
        condition: service_started
      metrics:
        condition: service_started

  kafka_consumer:
    build: ./kafka_consumer
    depends_on:
      kafka:
        condition: service_healthy
      cache_service:
        condition: service_started
      metrics:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - CONSUMER_GROUP=query-processors
      - TOPIC_MAIN=queries
      - TOPIC_RETRY=queries-retry
      - TOPIC_DLQ=queries-dlq
      - MAX_RETRIES=3
  traffic_generator:
    build: ./traffic_generator
    depends_on:
      kafka:
        condition: service_healthy
      kafka_consumer:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_MAIN=queries
      - DISTRIBUTION=zipf
      - NUM_REQUESTS=500
      - REQUESTS_PER_SECOND=10