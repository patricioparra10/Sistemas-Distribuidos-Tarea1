version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lfu

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

  metrics:
    build: ./metrics
    ports:
      - "8003:8003"
    depends_on:
      - redis

  response_generator:
    build: ./response_generator
    ports:
      - "8002:8002"
    volumes:
      - ./data:/data
    depends_on:
      - metrics

  cache_service:
    build: ./cache_service
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - response_generator
      - metrics

  traffic_generator:
    build: ./traffic_generator
    depends_on:
      - cache_service
    environment:
      - DISTRIBUTION=zipf  # cambiar a "uniform"
      - NUM_REQUESTS=1000